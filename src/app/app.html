<div class="min-h-screen flex bg-slate-50 text-slate-900">
  <!-- Sidebar: outside the outlet, so it stays put while pages swap -->
  <aside class="w-60 bg-white border-r border-slate-200 flex flex-col">
    <div class="h-16 flex items-center px-6 font-bold text-lg border-b border-slate-200">
      ApplyTrack
    </div>
    <nav class="p-3 space-y-1">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-indigo-50 text-indigo-600 font-medium"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          class="block px-4 py-2 rounded-lg text-sm text-slate-600 hover:bg-slate-100 transition-colors"
        >
          {{ item.label }}
        </a>
      }
    </nav>
  </aside>

  <!-- Main content: the routed page renders here and swaps on navigation -->
  <main class="flex-1 p-6">
    <router-outlet />
  </main>
</div>
